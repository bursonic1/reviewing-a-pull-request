name: Run container hourly

on:
  schedule:
   - cron: 0 */7 * * *
  workflow_dispatch:

jobs:
  run-container:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Pull image
        run: docker pull docker.io/nomadb3/sender:latest

      - name: Run container
        run: |
          docker run --rm \
            -e TOKEN="${{ secrets.TOKEN }}" \
            docker.io/nomadb3/sender:latest
