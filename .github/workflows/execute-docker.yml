name: Run container hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-container:
    runs-on: ubuntu-latest

    steps:
      - name: Pull image
        run: docker pull ghcr.io/your-org/your-image:latest

      - name: Run container
        run: |
          docker run --rm \
            -e TOKEN="${{ secrets.TOKEN }}" \
            ghcr.io/nomadb3/sender:latest
